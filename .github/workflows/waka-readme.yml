name: Waka Readme

on:
  workflow_dispatch:
  schedule:
    # Every day at 00:00 UTC
    - cron: "0 0 * * *"

# The action commits the refreshed section back to README.md.
permissions:
  contents: write

jobs:
  update-readme:
    name: Update this repo's README
    runs-on: ubuntu-latest
    env:
      HAS_WAKATIME_KEY: ${{ secrets.WAKATIME_API_KEY != '' }}
    steps:
      - name: Skip until the WakaTime key is configured
        if: env.HAS_WAKATIME_KEY != 'true'
        run: echo "WAKATIME_API_KEY is not set; nothing to update."

      - name: Update the WakaTime section
        if: env.HAS_WAKATIME_KEY == 'true'
        # Pinned to the master commit of 2026-10-23 instead of the moving branch.
        uses: athul/waka-readme@8991b596d85696d98ea96f775390a1bbe266c8c9
        with:
          WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }}
